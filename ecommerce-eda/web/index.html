<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Commerce</title></head>
<body>
  <h1>Serverless E-Commerce</h1>
  <p>Placeholder storefront. Runtime settings are served from <code>/config.json</code>.</p>
  <ul id="products"></ul>
  <script>
    fetch("/config.json").then(r => r.json())
      .then(cfg => fetch(cfg.apiUrl + "/products"))
      .then(r => r.json())
      .then(items => {
        document.getElementById("products").innerHTML =
          items.map(p => `<li>${p.name} - ${p.price}</li>`).join("");
      })
      .catch(console.error);
  </script>
</body>
</html>
